name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Mondays 05:00 UTC = 09:00 Asia/Dubai. GitHub does not guarantee punctuality
  # for scheduled runs and may delay them under load.
  schedule:
    - cron: "0 5 * * 1"

# contents:write so the refreshed snapshot can be committed back.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Refresh happens BEFORE the artifact is uploaded, so the deploy always
      # publishes fresh content even if the commit step below is skipped.
      # A non-zero exit here fails the job and leaves the previous site live.
      - name: Refresh GitHub project data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-stats.mjs

      # The refresh timestamp changes on every run, so this always commits.
      # That is deliberate: GitHub disables scheduled workflows after 60 days of
      # repository inactivity, and a weekly commit is what keeps this cron alive.
      - name: Commit refreshed snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/github-stats.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly refresh of GitHub project data [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
